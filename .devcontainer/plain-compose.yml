version: '3.8'

services:
  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.plain
      args:
        BASE_IMAGE: ${BASE_IMAGE:-mcr.microsoft.com/devcontainers/base:ubuntu-24.04}

    image: llama.cpp-rocm-docker:dev

    volumes:
      # Mount workspace
      - ..:/workspaces/llama.cpp-rocm-docker:cached

    environment:
      - HOST_WORKSPACE_ROOT=/workspaces/llama.cpp-rocm-docker

    user: vscode

    # Keep container running
    command: sleep infinity

    # Use host network (can be overridden if needed)
    network_mode: host

    # Ensure proper init process
    init: true